spring.application.name=Unified OCR Service

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.display-request-duration=true

tesseract.data.path=C:/Program Files/Tesseract-OCR/tessdata
tesseract.language=eng
tesseract.oem=1
tesseract.psm=6

pdf.render.dpi=300
invoice.pdf.render.dpi=300
invoice.pdf.poppler.command=pdftoppm

logging.level.com.docextract=DEBUG
logging.level.com.invoice.extractor=DEBUG
logging.level.com.medical.extractor=DEBUG
logging.level.net.sourceforge.tess4j=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# Medical OCR Configuration
medical.ocr.mode=hybrid
medical.ocr.paddle.enabled=true
medical.ocr.paddle.service-url=http://localhost:8000
medical.ocr.paddle.endpoint=/ocr
medical.ocr.paddle.timeout-seconds=30
medical.ocr.paddle.min-confidence=0.5
medical.ocr.tesseract.enabled=true
medical.ocr.tesseract.language=eng
medical.ocr.tesseract.psm=6
medical.ocr.extraction.organization-name-top-percentage=20
medical.ocr.extraction.min-applicant-name-length=3
medical.ocr.extraction.max-applicant-name-length=80
medical.ocr.extraction.min-organization-name-length=3
medical.ocr.extraction.enable-multi-candidate-scoring=true
medical.ocr.validation.validate-date-sequence=true
medical.ocr.validation.validate-days-difference=true
medical.ocr.validation.allow-null-fields=false
medical.ocr.validation.min-name-length=3
medical.ocr.logging.enable-ocr-type-logging=true
medical.ocr.logging.enable-fallback-logging=true
medical.ocr.logging.enable-extraction-logging=true
